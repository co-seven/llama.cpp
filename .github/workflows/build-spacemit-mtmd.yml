name: CI (SpacemiT MTMD)

on:
  push:
    branches:
      - spacemit-mtmd
  pull_request:
    branches:
      - spacemit-mtmd

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build SpacemiT MTMD
    runs-on: ubuntu-24.04

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Load shared variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .github/variables.env
          set +a

          {
            echo "SPACEMIT_IME_TOOLCHAIN_VERSION=${SPACEMIT_IME_TOOLCHAIN_VERSION}"
            echo "SPACEMIT_TOOLCHAIN_URL=${SPACEMIT_TOOLCHAIN_URL}"
            echo "SPACEMIT_ORT_VERSION=${SPACEMIT_ORT_VERSION}"
            echo "SPACEMIT_ORT_URL=${SPACEMIT_ORT_URL}"
            echo "SPACEMIT_MTMD_RELEASE_TAG=${SPACEMIT_MTMD_RELEASE_TAG}"
            echo "SPACEMIT_TOOLCHAIN_ARCHIVE=${SPACEMIT_TOOLCHAIN_ARCHIVE}"
            echo "SPACEMIT_ORT_ARCHIVE=${SPACEMIT_ORT_ARCHIVE}"
            echo "SPACEMIT_TOOLCHAIN_DIR=${SPACEMIT_TOOLCHAIN_DIR}"
            echo "SPACEMIT_ORT_ROOT=${SPACEMIT_ORT_ROOT}"
          } >> "$GITHUB_ENV"

          {
            echo "toolchain_version=${SPACEMIT_IME_TOOLCHAIN_VERSION}"
            echo "toolchain_url=${SPACEMIT_TOOLCHAIN_URL}"
            echo "ort_version=${SPACEMIT_ORT_VERSION}"
            echo "ort_url=${SPACEMIT_ORT_URL}"
            echo "release_tag=${SPACEMIT_MTMD_RELEASE_TAG}"
            echo "toolchain_archive=${SPACEMIT_TOOLCHAIN_ARCHIVE}"
            echo "ort_archive=${SPACEMIT_ORT_ARCHIVE}"
            echo "toolchain_dir=${SPACEMIT_TOOLCHAIN_DIR}"
            echo "ort_root=${SPACEMIT_ORT_ROOT}"
          } >> "$GITHUB_OUTPUT"

      - name: Cache SpacemiT Toolchain archive
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: ${{ steps.vars.outputs.toolchain_archive }}
          key: spacemit-toolchain-archive-${{ steps.vars.outputs.toolchain_version }}-${{ runner.os }}

      - name: Cache SpacemiT ORT archive
        id: cache-ort
        uses: actions/cache@v5
        with:
          path: ${{ steps.vars.outputs.ort_archive }}
          key: spacemit-ort-archive-${{ steps.vars.outputs.ort_version }}-${{ runner.os }}

      - name: Prepare SpacemiT Toolchain
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$SPACEMIT_TOOLCHAIN_ARCHIVE")"
          if [[ ! -f "$SPACEMIT_TOOLCHAIN_ARCHIVE" ]]; then
            curl -L --fail --retry 5 --retry-all-errors \
              -o "$SPACEMIT_TOOLCHAIN_ARCHIVE" \
              "$SPACEMIT_TOOLCHAIN_URL"
          fi

          rm -rf "$SPACEMIT_TOOLCHAIN_DIR"
          mkdir -p "$SPACEMIT_TOOLCHAIN_DIR"
          tar -xJf "$SPACEMIT_TOOLCHAIN_ARCHIVE" -C "$SPACEMIT_TOOLCHAIN_DIR" --strip-components=1

      - name: Prepare SpacemiT ORT
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$SPACEMIT_ORT_ARCHIVE")"
          if [[ ! -f "$SPACEMIT_ORT_ARCHIVE" ]]; then
            curl -L --fail --retry 5 --retry-all-errors \
              -o "$SPACEMIT_ORT_ARCHIVE" \
              "$SPACEMIT_ORT_URL"
          fi

          rm -rf "$SPACEMIT_ORT_ROOT"
          mkdir -p "$SPACEMIT_ORT_ROOT"
          tar -xzf "$SPACEMIT_ORT_ARCHIVE" -C "$SPACEMIT_ORT_ROOT"

          ORT_DIR=$(find "$SPACEMIT_ORT_ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [[ -z "${ORT_DIR}" ]]; then
            ORT_DIR="${PWD}/${SPACEMIT_ORT_ROOT}"
          else
            ORT_DIR="${PWD}/${ORT_DIR}"
          fi

          if [[ ! -d "${ORT_DIR}/include" || ! -d "${ORT_DIR}/lib" || ! -d "${ORT_DIR}/samples" ]]; then
            echo "error: invalid SPACEMIT_ORT_DIR layout at ${ORT_DIR}" >&2
            find "$SPACEMIT_ORT_ROOT" -maxdepth 2 -type d | sort
            exit 1
          fi

          echo "SPACEMIT_ORT_DIR=${ORT_DIR}" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          export RISCV_ROOT_PATH=${PWD}/${SPACEMIT_TOOLCHAIN_DIR}
          if [[ ! -d "${SPACEMIT_ORT_DIR}/include" ]]; then
            echo "error: include directory not found under SPACEMIT_ORT_DIR: ${SPACEMIT_ORT_DIR}/include" >&2
            exit 1
          fi

          if [[ ! -d "${SPACEMIT_ORT_DIR}/lib" ]]; then
            echo "error: lib directory not found under SPACEMIT_ORT_DIR: ${SPACEMIT_ORT_DIR}/lib" >&2
            exit 1
          fi

          if [[ ! -d "${SPACEMIT_ORT_DIR}/samples" ]]; then
            echo "error: samples directory not found under SPACEMIT_ORT_DIR: ${SPACEMIT_ORT_DIR}/samples" >&2
            exit 1
          fi

          echo "Using SPACEMIT_ORT_DIR=${SPACEMIT_ORT_DIR}"
          rm -rf build/CMakeCache.txt
          cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_CPU_RISCV64_SPACEMIT=ON \
              -DGGML_CPU_REPACK=OFF \
              -DLLAMA_CURL=OFF \
              -DGGML_RVV=ON \
              -DGGML_RV_ZVFH=ON \
              -DGGML_RV_ZFH=ON \
              -DGGML_RV_ZICBOP=ON \
              -DGGML_RV_ZIHINTPAUSE=ON \
              -DGGML_RV_ZBA=ON \
              -DCMAKE_INSTALL_PREFIX=build/installed \
              -DCMAKE_TOOLCHAIN_FILE=${PWD}/cmake/riscv64-spacemit-linux-gnu-gcc.cmake \
              -DLLAMA_SERVER_SMT_VISION=ON \
              -DSPACEMIT_ORT_DIR=${SPACEMIT_ORT_DIR}

          cmake --build build --parallel "$(nproc)" --config Release

          pushd build >/dev/null
          make install
          popd >/dev/null

      - name: Pack artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          ASSET_NAME="llama-${SPACEMIT_MTMD_RELEASE_TAG}-bin-spacemit-mtmd.tar.gz"
          tar -czf "release/${ASSET_NAME}" -C build/installed .

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-bin-spacemit-mtmd
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - build
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Load shared variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .github/variables.env
          set +a

          {
            echo "SPACEMIT_MTMD_RELEASE_TAG=${SPACEMIT_MTMD_RELEASE_TAG}"
          } >> "$GITHUB_ENV"

          {
            echo "release_tag=${SPACEMIT_MTMD_RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: llama-bin-spacemit-mtmd
          path: release

      - name: Determine release info
        id: release_info
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "tag_name=${{ steps.vars.outputs.release_tag }}-pr${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "release_name=${{ steps.vars.outputs.release_tag }} PR #${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ steps.vars.outputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "release_name=${{ steps.vars.outputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          files: release/*.tar.gz
          body: |
            SpacemiT MTMD build for `spacemit-mtmd`.
            Commit: `${{ github.sha }}`
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
